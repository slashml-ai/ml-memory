# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - slashmlApiKey
    properties:
      slashmlApiKey:
        type: string
        description: Your SlashML API key (sml_live_...) from https://app.slashml.ai
      slashmlUserId:
        type: string
        description: Optional default user or workspace namespace
        default: default
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@slashml/mcp'],
      env: {
        SLASHML_API_KEY: config.slashmlApiKey,
        ...(config.slashmlUserId ? { SLASHML_USER_ID: config.slashmlUserId } : {})
      }
    })
