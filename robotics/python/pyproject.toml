[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slashml-robotics"
version = "1.0.0"
description = "Official Robotics & Spatial Memory SDK for SlashML"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "SlashML Robotics Inc."}]
dependencies = [
    "slashml-memory>=1.0.9",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://slashml.ai"
Repository = "https://github.com/slashml-ai/slashml-robotics"

[tool.setuptools]
packages = [
    "slashml_robotics",
    "slashml_robotics.ros2",
    "slashml_robotics.mcp",
]
