[package]
name = "slashml-robotics"
version = "1.0.0"
edition = "2021"
description = "Official Rust client for SlashML Robotics spatial memory"
license = "Apache-2.0"
homepage = "https://slashml.ai"
repository = "https://github.com/slashml-ai/slashml-robotics"
documentation = "https://slashml.ai/docs"
keywords = ["robotics", "spatial-memory", "embodied-ai", "ros2", "zenoh"]


[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

